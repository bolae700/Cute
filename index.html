<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- خطوط Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Montserrat:wght@800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #087094;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .font-display {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
    }
    .font-arabic {
      font-family: 'Cairo', 'Montserrat', sans-serif;
    }

    /* حركات الموجات الصوتية */
    @keyframes barBounce {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }
    .animate-bar-1 { animation: barBounce 0.8s ease-in-out infinite alternate; }
    .animate-bar-2 { animation: barBounce 0.6s ease-in-out infinite 0.15s alternate; }
    .animate-bar-3 { animation: barBounce 0.9s ease-in-out infinite 0.3s alternate; }
    .animate-bar-4 { animation: barBounce 0.7s ease-in-out infinite 0.1s alternate; }
    .animate-bar-5 { animation: barBounce 0.5s ease-in-out infinite 0.25s alternate; }

    /* حركات العناصر العائمة في الخلفية */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-22px) rotate(12deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
      50% { transform: translateY(20px) translateX(12px) rotate(-10deg); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-16px) scale(1.08); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.18; transform: scale(1); }
      50% { opacity: 0.32; transform: scale(1.1); }
    }
    .animate-float-1 { animation: float1 7s ease-in-out infinite; }
    .animate-float-2 { animation: float2 9s ease-in-out infinite; }
    .animate-float-3 { animation: float3 6s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulseGlow 5s ease-in-out infinite; }

    /* سلاسة التنقل */
    .view-content {
      transition: opacity 0.18s ease-out, transform 0.18s ease-out;
    }
    .view-hidden {
      display: none !important;
      opacity: 0;
      transform: scale(0.96);
    }
    .view-visible {
      display: flex !important;
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>

  <!-- ================= أكواد جافاسكريبت والمؤثرات الصوتية والمشغل ================= -->
  <script>
    // 1. قائمة الأغاني المطلوبة
    const TRACKS = [
      { id: 1, title: 'Ebru Gündeş', url: 'https://audio.jukehost.co.uk/01a109f7-8be4-73d3-a67d-baea5452a5e7' },
      { id: 2, title: 'Sımarık', url: 'https://audio.jukehost.co.uk/01a109f7-8bd9-72f8-a052-043500c3c8f2' },
      { id: 3, title: 'Yandırdın Kalbimi', url: 'https://audio.jukehost.co.uk/01a109f7-8a9f-714c-a799-386b6fa58154' }
    ];

    let currentTrackIdx = 0;
    let isPlaying = false;
    let isLooping = false;
    let isShuffle = false;
    let isMuted = false;
    let sfxEnabled = true;
    let activeTab = 'HOME';

    const audio = new Audio();
    audio.src = TRACKS[currentTrackIdx].url;
    audio.volume = 0.85;

    // 2. محرك الأصوات التفاعلي (Web Audio API Synthesizer)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playClickSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    function playTabSwitchSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.09, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.06);
      } catch (e) {}
    }

    function playTrackChangeSfx() {
      if (!sfxEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.07, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    // 3. الساعة الرقمية المباشرة
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = `${h}:${m}:${s}`;

      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      document.getElementById('dateDisplay').textContent = `${days[now.getDay()]} • ${now.getDate()} ${months[now.getMonth()]}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // مفتاح كتم/تفعيل أصوات الواجهة SFX
    document.getElementById('sfxToggleBtn').addEventListener('click', () => {
      sfxEnabled = !sfxEnabled;
      const sfxText = document.getElementById('sfxText');
      if (sfxEnabled) {
        sfxText.textContent = 'SFX ON';
        sfxText.className = 'font-mono text-[9px] uppercase tracking-wider text-[#9ee3f7]';
        playClickSfx();
      } else {
        sfxText.textContent = 'SFX OFF';
        sfxText.className = 'font-mono text-[9px] uppercase tracking-wider text-white/50';
      }
    });

    // 4. نظام التنقل السلس بين التبويبات
    const tabs = ['HOME', 'MUSIC', 'PHOTO'];
    function switchTab(newTab) {
      if (activeTab === newTab) return;
      playTabSwitchSfx();
      activeTab = newTab;

      // إخفاء كل العناصر وإظهار المحدد
      ['Home', 'Music', 'Photo'].forEach(t => {
        const leftEl = document.getElementById(`left${t}`);
        const rightEl = document.getElementById(`right${t}`);
        if (t.toUpperCase() === newTab) {
          leftEl.className = 'view-content view-visible' + (t === 'Music' ? ' w-full h-full' : '') + ' flex items-center justify-center';
          rightEl.className = 'view-content view-visible flex-col items-center justify-center w-full';
        } else {
          leftEl.className = 'view-content view-hidden';
          rightEl.className = 'view-content view-hidden';
        }
      });

      // تحريك إطار الكبسولة في شريط التنقل
      const indicator = document.getElementById('activePillIndicator');
      if (newTab === 'HOME') {
        indicator.style.left = '6px';
        indicator.style.width = 'calc(33.333% - 8px)';
      } else if (newTab === 'MUSIC') {
        indicator.style.left = 'calc(33.333% + 2px)';
        indicator.style.width = 'calc(33.333% - 4px)';
      } else if (newTab === 'PHOTO') {
        indicator.style.left = 'calc(66.666% + 2px)';
        indicator.style.width = 'calc(33.333% - 8px)';
      }
    }

    document.getElementById('navHome').addEventListener('click', () => switchTab('HOME'));
    document.getElementById('navMusic').addEventListener('click', () => switchTab('MUSIC'));
    document.getElementById('navPhoto').addEventListener('click', () => switchTab('PHOTO'));

    // 5. مشغل الموسيقى المتكامل
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seekSlider = document.getElementById('seekSlider');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationText = document.getElementById('durationText');
    const trackIndexText = document.getElementById('trackIndexText');
    const currentSongTitle = document.getElementById('currentSongTitle');
    const songTitlePill = document.getElementById('songTitlePill');
    const loopBtn = document.getElementById('loopBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const discIcon = document.getElementById('discIcon');
    const equalizerBars = document.getElementById('equalizerBars');

    function formatTime(s) {
      if (isNaN(s) || s < 0) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function loadTrack(idx) {
      currentTrackIdx = idx;
      audio.src = TRACKS[idx].url;
      trackIndexText.textContent = `${idx + 1}/${TRACKS.length}`;
      currentSongTitle.textContent = TRACKS[idx].title;
      if (isPlaying) {
        audio.play().catch(() => {});
      }
    }

    function togglePlay() {
      playClickSfx();
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        discIcon.classList.remove('animate-spin');
        setEqualizerState(false);
      } else {
        audio.play().then(() => {
          isPlaying = true;
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
          discIcon.classList.add('animate-spin');
          setEqualizerState(true);
        }).catch(() => {});
      }
    }

    function setEqualizerState(active) {
      const bars = equalizerBars.children;
      for (let i = 0; i < bars.length; i++) {
        if (active) {
          bars[i].className = `w-0.5 sm:w-1 bg-[#9ee3f7] rounded-full h-full animate-bar-${i + 1}`;
        } else {
          bars[i].className = 'w-0.5 sm:w-1 bg-[#9ee3f7] rounded-full h-1.5';
        }
      }
    }

    function nextTrack() {
      playTrackChangeSfx();
      if (isShuffle) {
        currentTrackIdx = Math.floor(Math.random() * TRACKS.length);
      } else {
        currentTrackIdx = (currentTrackIdx + 1) % TRACKS.length;
      }
      loadTrack(currentTrackIdx);
      if (!isPlaying) togglePlay();
    }

    function prevTrack() {
      playTrackChangeSfx();
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        currentTrackIdx = (currentTrackIdx - 1 + TRACKS.length) % TRACKS.length;
        loadTrack(currentTrackIdx);
        if (!isPlaying) togglePlay();
      }
    }

    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    songTitlePill.addEventListener('click', nextTrack);

    audio.addEventListener('loadedmetadata', () => {
      seekSlider.max = audio.duration || 100;
      durationText.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      seekSlider.value = audio.currentTime;
      currentTimeText.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      if (isLooping) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } else {
        nextTrack();
      }
    });

    seekSlider.addEventListener('input', (e) => {
      audio.currentTime = parseFloat(e.target.value);
    });

    loopBtn.addEventListener('click', () => {
      playClickSfx();
      isLooping = !isLooping;
      audio.loop = isLooping;
      loopBtn.className = isLooping ? 'p-0.5 rounded text-[#9ee3f7]' : 'p-0.5 rounded text-white/50 hover:text-white/80';
    });

    shuffleBtn.addEventListener('click', () => {
      playClickSfx();
      isShuffle = !isShuffle;
      shuffleBtn.className = isShuffle ? 'p-0.5 rounded text-[#9ee3f7]' : 'p-0.5 rounded text-white/50 hover:text-white/80';
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
      isMuted = audio.volume === 0;
    });

    muteBtn.addEventListener('click', () => {
      playClickSfx();
      isMuted = !isMuted;
      audio.muted = isMuted;
      const volIcon = document.getElementById('volumeIcon');
      if (isMuted) {
        volIcon.classList.add('text-rose-300');
      } else {
        volIcon.classList.remove('text-rose-300');
      }
    });
  </script>
</body>
</html>
